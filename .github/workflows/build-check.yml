name: Build Check

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      
      - name: Build site
        run: bundle exec jekyll build
      
      - name: Check for errors
        run: |
          if [ ! -d "_site" ]; then
            echo "Jekyll build failed - no _site directory"
            exit 1
          fi
          echo "✅ Build successful - site generated"
