name: Auto-Release on Push to Main

on:
  push:
    branches:
      - main
    paths:
      - resume.md
      - _layouts/**
      - _config.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for version calculation

      - name: Get latest tag
        id: tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG"

      - name: Calculate next version
        id: version
        run: |
          LATEST=${{ steps.tag.outputs.latest_tag }}
          # Remove 'v' prefix
          VERSION=${LATEST#v}
          
          # Extract version parts
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          
          # Increment patch version
          PATCH=$((PATCH + 1))
          NEW_VERSION="v$MAJOR.$MINOR.$PATCH"
          
          echo "next_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Next version: $NEW_VERSION"

      - name: Check if tag already exists for this commit
        id: check_tag
        run: |
          CURRENT_TAG=$(git describe --exact-match --tags 2>/dev/null || echo "")
          if [ -z "$CURRENT_TAG" ]; then
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          else
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          fi

      - name: Regenerate index.md from resume.md
        if: steps.check_tag.outputs.tag_exists == 'false'
        run: |
          # Regenerate index.md with frontmatter from resume.md
          cat > index.md <<'INDEXEOF'
---
layout: default
title: "Brian J. Murray - Resume"
---

INDEXEOF
          cat resume.md >> index.md

      - name: Create release
        if: steps.check_tag.outputs.tag_exists == 'false'
        id: release
        run: |
          gh release create ${{ steps.version.outputs.next_version }} \
            --title "Resume ${{ steps.version.outputs.next_version }}" \
            --notes "Auto-generated release from changes to resume.md or layout"
          echo "created=true" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pandoc and TeX Live
        if: steps.release.outputs.created == 'true'
        run: sudo apt-get update && sudo apt-get install -y pandoc texlive-xetex

      - name: Generate PDF
        if: steps.release.outputs.created == 'true'
        run: pandoc resume.md -o resume.pdf --pdf-engine=xelatex --standalone

      - name: Upload PDF to Release
        if: steps.release.outputs.created == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get release ID from tag
          RELEASE_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.version.outputs.next_version }}" \
            | grep '"id"' | head -1 | awk '{print $2}' | tr -d ',')
          
          # Upload asset via REST API
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @resume.pdf \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=resume.pdf"

      - name: Commit regenerated index.md to main
        if: steps.release.outputs.created == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.md
          git commit -m "Auto-regenerate index.md from resume.md for v${{ steps.version.outputs.next_version }}" || echo "No changes to commit"
          git push origin main || echo "Push failed (may already be up to date)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
