name: Auto-Release on Push to Main

on:
  push:
    branches:
      - main
    paths:
      - index.md
      - resume.md
      - _layouts/**
      - _config.yml
      - _posts/**
      - projects/**

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for version calculation

      - name: Get latest tag
        id: tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG"

      - name: Calculate next version
        id: version
        run: |
          LATEST=${{ steps.tag.outputs.latest_tag }}
          # Remove 'v' prefix
          VERSION=${LATEST#v}
          
          # Extract version parts
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          
          # Increment patch version
          PATCH=$((PATCH + 1))
          NEW_VERSION="v$MAJOR.$MINOR.$PATCH"
          
          echo "next_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Next version: $NEW_VERSION"

      - name: Check if tag already exists for this commit
        id: check_tag
        run: |
          CURRENT_TAG=$(git describe --exact-match --tags 2>/dev/null || echo "")
          if [ -z "$CURRENT_TAG" ]; then
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          else
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          fi

      - name: Create release
        if: steps.check_tag.outputs.tag_exists == 'false'
        id: release
        run: |
          gh release create ${{ steps.version.outputs.next_version }} \
            --title "Resume ${{ steps.version.outputs.next_version }}" \
            --notes "Auto-generated release from changes to resume.md or layout"
          echo "created=true" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pandoc and TeX Live
        if: steps.release.outputs.created == 'true'
        run: sudo apt-get update && sudo apt-get install -y pandoc texlive-xetex

      - name: Generate PDF
        if: steps.release.outputs.created == 'true'
        run: pandoc resume.md -o resume.pdf --pdf-engine=xelatex --standalone

      - name: Upload PDF to Release
        if: steps.release.outputs.created == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get release ID from tag (using jq for reliable JSON parsing)
          RELEASE_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.version.outputs.next_version }}" \
            | jq -r '.id')
          
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "ERROR: Could not get release ID from API response"
            exit 1
          fi
          
          echo "Uploading PDF to release ID: $RELEASE_ID"
          
          # Upload asset via REST API
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @resume.pdf \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=resume.pdf"
