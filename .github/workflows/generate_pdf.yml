name: Generate PDF on release
on:
  release:
    types: [published]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pandoc and TeX Live
        run: sudo apt-get update && sudo apt-get install -y pandoc texlive-xetex
      - name: Generate PDF
        run: pandoc resume.md -o resume.pdf --pdf-engine=xelatex
      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} resume.pdf \
            --repo ${{ github.repository }} \
            --clobber
