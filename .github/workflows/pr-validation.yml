name: PR Validation & Staging Deploy

on:
  pull_request:
    branches: [ main ]
    paths:
      - '_posts/**'
      - '_layouts/**'
      - 'blog/**'
      - '_config.yml'
      - 'Gemfile'
      - 'test.sh'
      - '.github/workflows/pr-validation.yml'

jobs:
  validate-and-stage:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    
    steps:
    - name: Checkout PR branch
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.1'
        bundler-cache: true
    
    - name: Run validation tests
      run: |
        chmod +x ./test.sh
        ./test.sh
        
    - name: Build Jekyll for staging
      run: |
        bundle exec jekyll build \
          --destination ./staging \
          --config _config.yml,_config_staging.yml
      
    - name: Verify staging build
      run: |
        if [ ! -d "./staging" ]; then
          echo "ERROR: Staging directory not created"
          exit 1
        fi
        
        if [ ! -f "./staging/index.html" ]; then
          echo "ERROR: index.html not found in staging build"
          exit 1
        fi
        
        echo "✓ Staging build successful"
        echo "✓ Files generated: $(find ./staging -type f | wc -l)"
    
    - name: Check for broken links (basic)
      run: |
        echo "Checking for common issues..."
        
        # Check tag pages generated
        if [ ! -d "./staging/blog/tags" ]; then
          echo "ERROR: Tag pages not generated"
          exit 1
        fi
        
        TAG_COUNT=$(find ./staging/blog/tags -name "index.html" | wc -l)
        echo "✓ Generated $TAG_COUNT tag pages"
        
        # Check for empty tag pages
        EMPTY_TAGS=$(find ./staging/blog/tags -name "index.html" -exec sh -c 'grep -L "blog-post-preview" "$1" 2>/dev/null' _ {} \; | wc -l)
        if [ "$EMPTY_TAGS" -gt 0 ]; then
          echo "⚠️  WARNING: $EMPTY_TAGS tag pages have no posts (may still be OK)"
        fi
    
    
    - name: Comment PR with status
      uses: actions/github-script@v7
      if: always()
      env:
        STATUS: ${{ job.status }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const status = process.env.STATUS;
          const message = status === 'success'
            ? '✅ **Build & validation successful!**\n\nAll tag pages validated. Tags match post definitions. Ready to merge.'
            : '❌ **Build failed**\n\nPlease check the logs for details and fix the issues before this PR can be merged.';
          
          try {
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
          } catch (error) {
            console.error('Failed to post comment:', error);
            throw error;
          }
