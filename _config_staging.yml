title: "Brian J. Murray - Resume (Preview)"
# baseurl is empty - Surge deploys to root of subdomain
baseurl: ""
# URL is set dynamically per-PR (cfktech-pr-{number}.surge.sh)
url: ""

# Plugins
plugins:
  - jekyll-feed

# Collections for blog posts
collections:
  posts:
    output: true
    permalink: /blog/:title/

# Defaults for post layout
defaults:
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "post"
