---
layout: default
---

<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%B %d, %Y" }}
      </time>
    </p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <footer class="post-donation">
    <hr>
    <p><strong>Did you find this helpful?</strong></p>
    <p>If this post added value to your day, consider supporting my work with a coffee. It means a lot and helps me keep creating content like this.</p>
    <a href="https://buymeacoffee.com/cfktech" class="btn btn-secondary" target="_blank" rel="noopener noreferrer">Buy Me a Coffee ☕</a>
  </footer>
</article>
